<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>QR Cracker - Gandhi Puzzle</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 15px;

    font-family: Arial, sans-serif;

    background: #111;

    color: white;

    text-align: center;
}


.container {

    width: 100%;

    max-width: 550px;

    margin: auto;

    background: #222;

    padding: 25px;

    border-radius: 20px;

    box-shadow: 0 0 20px #00ff99;
}


h1 {

    color: #00ff99;

    margin-top: 0;
}


h2 {

    color: #00ccff;
}


.instruction {

    font-size: 17px;

    line-height: 1.6;
}


/* =========================
   PUZZLE
========================= */

#puzzle {

    width: 100%;

    max-width: 420px;

    aspect-ratio: 1 / 1;

    margin: 25px auto;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    grid-template-rows: repeat(3, 1fr);

    gap: 3px;

    background: #000;

    padding: 3px;

    border-radius: 12px;

    overflow: hidden;
}


/* =========================
   TILE
========================= */

.tile {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;

    border: 2px solid #333;

    background: white;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


.tile img {

    position: absolute;

    width: 300%;

    height: 300%;

    max-width: none;

    pointer-events: none;

    user-select: none;
}


/* EMPTY TILE */

.empty {

    background: #111;

    border: 2px solid #111;

    cursor: default;
}


/* =========================
   MESSAGE
========================= */

#message {

    font-size: 19px;

    font-weight: bold;

    min-height: 30px;

    margin: 15px;
}


/* =========================
   RESET BUTTON
========================= */

#resetButton {

    padding: 12px 25px;

    border: none;

    border-radius: 10px;

    background: #00ccff;

    color: #111;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-bottom: 15px;
}


/* =========================
   LOCATION
========================= */

#location {

    display: none;

    margin-top: 30px;
}


#location img {

    width: 100%;

    max-width: 450px;

    border-radius: 15px;

    margin-top: 15px;
}


.success {

    color: #00ff99;
}


.location-text {

    font-size: 20px;

    line-height: 1.6;

    margin-top: 20px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        padding: 10px;
    }


    .container {

        padding: 18px;
    }


    h1 {

        font-size: 28px;
    }


    h2 {

        font-size: 21px;
    }


    .instruction {

        font-size: 16px;
    }


    .location-text {

        font-size: 18px;
    }

}

</style>

</head>


<body>


<div class="container">


<h1>🧩 QR CRACKER</h1>


<h2>
REVEAL THE NEXT LOCATION
</h2>


<p class="instruction">

Arrange the Gandhi image.

<br><br>

<b>
Tap a piece next to the empty space to move it.
</b>

</p>


<!-- PUZZLE -->

<div id="puzzle"></div>


<button id="resetButton">

🔄 SHUFFLE AGAIN

</button>


<p id="message">

Loading puzzle...

</p>


<!-- =========================
     LOCATION REVEAL
========================= -->

<div id="location">


<h2 class="success">

🎉 PUZZLE SOLVED!

</h2>


<p>

You have unlocked the next location!

</p>


<img
    src="gandhi.jpg"
    alt="Gandhi Location"
>


<h2>

📍 NEXT DESTINATION

</h2>


<p class="location-text">

Find this place in the college.

<br><br>

Go there and search carefully for the

<b>next QR code!</b>

</p>


</div>


</div>


<script>


/* ==================================================
   SETTINGS
================================================== */

const SIZE = 3;

const TOTAL = 9;


/* ==================================================
   ELEMENTS
================================================== */

const puzzle =
    document.getElementById("puzzle");


const message =
    document.getElementById("message");


const resetButton =
    document.getElementById("resetButton");


const locationBox =
    document.getElementById("location");


/* ==================================================
   PUZZLE ARRAY
================================================== */

/*
0 1 2
3 4 5
6 7 8

8 = empty space
*/

let tiles = [];


/* ==================================================
   START
================================================== */

function startPuzzle() {

    tiles = [

        0, 1, 2,
        3, 4, 5,
        6, 7, 8

    ];


    /*
    Shuffle by making
    random LEGAL moves.

    This guarantees that
    the puzzle is solvable.
    */

    let empty = 8;


    for (let i = 0; i < 100; i++) {

        const possible =
            getPossibleMoves(empty);


        const randomIndex =
            Math.floor(
                Math.random() *
                possible.length
            );


        const move =
            possible[randomIndex];


        tiles[empty] =
            tiles[move];


        tiles[move] =
            8;


        empty = move;

    }


    render();

}


/* ==================================================
   GET POSSIBLE MOVES
================================================== */

function getPossibleMoves(empty) {

    const moves = [];


    const row =
        Math.floor(empty / SIZE);


    const column =
        empty % SIZE;


    /* UP */

    if (row > 0) {

        moves.push(
            empty - SIZE
        );

    }


    /* DOWN */

    if (row < SIZE - 1) {

        moves.push(
            empty + SIZE
        );

    }


    /* LEFT */

    if (column > 0) {

        moves.push(
            empty - 1
        );

    }


    /* RIGHT */

    if (column < SIZE - 1) {

        moves.push(
            empty + 1
        );

    }


    return moves;

}


/* ==================================================
   RENDER PUZZLE
================================================== */

function render() {

    puzzle.innerHTML = "";


    for (
        let position = 0;
        position < TOTAL;
        position++
    ) {


        const tileNumber =
            tiles[position];


        const tile =
            document.createElement("div");


        tile.className =
            "tile";


        /*
        EMPTY TILE
        */

        if (tileNumber === 8) {

            tile.classList.add(
                "empty"
            );


        } else {


            /*
            IMAGE TILE
            */

            const img =
                document.createElement("img");


            img.src =
                "gandhi.jpg";


            /*
            Find original
            image position.
            */

            const row =
                Math.floor(
                    tileNumber / SIZE
                );


            const column =
                tileNumber % SIZE;


            /*
            Move large image
            so the required
            section appears.
            */

            img.style.left =
                (-column * 100) + "%";


            img.style.top =
                (-row * 100) + "%";


            tile.appendChild(img);


            /*
            CLICK
            */

            tile.addEventListener(
                "click",
                function () {

                    moveTile(position);

                }
            );

        }


        puzzle.appendChild(tile);

    }


    /*
    Check solved
    */

    if (isSolved()) {

        puzzleSolved();

    } else {

        message.innerHTML =
            "Move the pieces to rebuild Gandhi.";

    }

}


/* ==================================================
   MOVE TILE
================================================== */

function moveTile(position) {


    /*
    Find empty space
    */

    const empty =
        tiles.indexOf(8);


    /*
    Check whether the
    clicked tile is next
    to empty space.
    */

    if (!isAdjacent(position, empty)) {

        message.innerHTML =
            "⬜ Move a piece next to the empty space.";

        return;

    }


    /*
    SWAP
    */

    tiles[empty] =
        tiles[position];


    tiles[position] =
        8;


    /*
    Redraw
    */

    render();

}


/* ==================================================
   CHECK ADJACENT
================================================== */

function isAdjacent(a, b) {

    const rowA =
        Math.floor(a / SIZE);


    const colA =
        a % SIZE;


    const rowB =
        Math.floor(b / SIZE);


    const colB =
        b % SIZE;


    const rowDifference =
        Math.abs(rowA - rowB);


    const columnDifference =
        Math.abs(colA - colB);


    return (

        rowDifference +
        columnDifference === 1

    );

}


/* ==================================================
   CHECK SOLVED
================================================== */

function isSolved() {

    for (
        let i = 0;
        i < TOTAL;
        i++
    ) {

        if (tiles[i] !== i) {

            return false;

        }

    }


    return true;

}


/* ==================================================
   PUZZLE SOLVED
================================================== */

function puzzleSolved() {


    /*
    Stop showing puzzle
    */

    puzzle.style.display =
        "none";


    resetButton.style.display =
        "none";


    document.querySelector(
        ".instruction"
    ).style.display =
        "none";


    message.innerHTML =
        "🎉 Congratulations!";


    message.className =
        "success";


    /*
    Show location
    */

    locationBox.style.display =
        "block";


    locationBox.scrollIntoView({

        behavior: "smooth"

    });

}


/* ==================================================
   RESET
================================================== */

resetButton.addEventListener(

    "click",

    function () {

        locationBox.style.display =
            "none";


        puzzle.style.display =
            "grid";


        resetButton.style.display =
            "inline-block";


        message.className = "";


        startPuzzle();

    }

);


/* ==================================================
   START GAME
================================================== */

startPuzzle();

</script>


</body>

</html>
